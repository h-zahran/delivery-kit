name: CI

on:
  push:
    branches: [main]
    # Every tag, and `**` rather than `*` because `*` does not match `/` in a
    # filter pattern. The tag step below is what rejects a tag that is not
    # <plugin>-v<version>; see the reasoning there for why that check is not
    # written as a trigger filter.
    tags: ['**']
  pull_request:

defaults:
  run:
    shell: bash

# This workflow clones and executes third-party code, and actions/checkout
# persists credentials into .git/config by default. It only ever needs to read
# the repository.
permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Ensure jq
        run: |
          if jq --version; then exit 0; fi
          case "${{ matrix.os }}" in
            ubuntu-latest)  sudo apt-get update && sudo apt-get install -y jq ;;
            macos-latest)   brew install jq ;;
            windows-latest) choco install jq -y ;;
          esac
          jq --version

      - name: Install bats
        run: git clone --depth 1 --branch v1.11.0 https://github.com/bats-core/bats-core.git "$HOME/bats"

      # -r so a suite added in a subdirectory of one of these cannot be
      # silently skipped while CI stays green, and --print-output-on-failure
      # so a red test's output lands in the job log — the only diagnostic
      # channel a matrix runner has. The paths are named explicitly rather
      # than discovered, because a glob that matches nothing expands to
      # itself and bats would report "no such file" — loudly, but for the
      # wrong reason. A test in tests/portability.bats pins that every suite
      # directory is covered by this line — directly or via an ancestor,
      # since -r recurses — and polices the contributing guide's copy of the
      # same command.
      - name: Run the test suites
        run: bash "$HOME/bats/bin/bats" -r --print-output-on-failure tests handoff/tests pipeline/tests

  version:
    name: version agreement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: every plugin's manifest, marketplace entry and changelog agree
        run: |
          # A hand-maintained twin of the bats gate in tests/portability.bats.
          # The two are kept in step BY HAND and have drifted once already —
          # an unanchored regex here read a heading the bats copy rejected.
          # Every check below exists there; edit the pair together.
          checked=0
          for dir in */; do
            p="${dir%/}"
            [ -f "$p/.claude-plugin/plugin.json" ] || continue
            checked=$((checked + 1))
            pn=$(jq -r '.name // empty' "$p/.claude-plugin/plugin.json")
            pv=$(jq -r '.version // empty' "$p/.claude-plugin/plugin.json")
            [ -n "$pn" ] || { echo "$p: plugin.json has no name"; exit 1; }
            [ -n "$pv" ] || { echo "$p: plugin.json has no version"; exit 1; }
            # The tag gate below resolves a plugin from the DIRECTORY name;
            # this loop resolves entries from the manifest name. Pin the two
            # identities together or the gates key on different things.
            [ "$pn" = "$p" ] || { echo "$p: plugin.json name '$pn' does not match its directory"; exit 1; }
            jq -e --arg n "$pn" '.plugins[] | select(.name == $n)' .claude-plugin/marketplace.json > /dev/null \
              || { echo "$p: no marketplace entry named $pn"; exit 1; }
            mv=$(jq -r --arg n "$pn" '.plugins[] | select(.name == $n) | .version // empty' .claude-plugin/marketplace.json)
            [ -n "$mv" ] || { echo "$p: marketplace entry $pn has no version"; exit 1; }
            ms=$(jq -r --arg n "$pn" '.plugins[] | select(.name == $n) | .source // empty' .claude-plugin/marketplace.json)
            src="${ms#./}"; src="${src%/}"
            [ "$src" = "$p" ] || { echo "$p: marketplace entry $pn has source '$ms', which does not resolve to $p"; exit 1; }
            # `|| true` so a missing heading reaches the diagnostic below —
            # Actions runs this under `bash -eo pipefail`. Anchored with a
            # trailing $ exactly as the bats copy is: an unanchored match
            # accepted '## [X.Y.Z] - DATE (hotfix)' here while bats refused it.
            cv=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$' "$p/CHANGELOG.md" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
            echo "$p: plugin=$pv marketplace=$mv changelog=$cv"
            [ -n "$cv" ] || { echo "$p: $p/CHANGELOG.md has no '## [X.Y.Z] - YYYY-MM-DD' heading"; exit 1; }
            [ "$pv" = "$mv" ] || { echo "$p: plugin.json and marketplace.json disagree"; exit 1; }
            [ "$pv" = "$cv" ] || { echo "$p: plugin.json and CHANGELOG.md disagree"; exit 1; }
          done
          [ "$checked" -ge 1 ] || { echo "no plugin directories found"; exit 1; }
          # The other direction: every marketplace entry names a directory
          # that exists, and the two walks cover the same set.
          entries=0
          while IFS= read -r en; do
            # jq on windows-latest is a native binary with text-mode stdout:
            # each line it prints ends `\r\n`, and `read` keeps that CR while
            # command substitution strips it — measured in the bats twin. A
            # name carrying a stray CR matches no marketplace entry, so this
            # walk would false-red a clean tree wherever jq emits CRLF.
            en="${en%$'\r'}"
            entries=$((entries + 1))
            es=$(jq -r --arg n "$en" '.plugins[] | select(.name == $n) | .source // empty' .claude-plugin/marketplace.json)
            ed="${es#./}"; ed="${ed%/}"
            [ -n "$ed" ] && [ -f "$ed/.claude-plugin/plugin.json" ] \
              || { echo "marketplace entry '$en': source '$es' names no plugin directory"; exit 1; }
          done < <(jq -r '.plugins[].name' .claude-plugin/marketplace.json)
          [ "$entries" -eq "$checked" ] || { echo "marketplace lists $entries plugins, the tree holds $checked"; exit 1; }

      - name: tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Tags are <plugin>-v<version> now. A marketplace can carry more than
          # one plugin entry, so a bare version tag names no manifest to check
          # against. The old `v*` filter would have matched a bare tag anyway,
          # and the step behind it read one fixed path — the root
          # `.claude-plugin/plugin.json` — which no longer exists now that each
          # plugin's manifest lives in its own directory. So it would not have
          # compared the wrong version: it would have died on a missing file
          # for any tag that reached it, reporting nothing about the tag.
          #
          # The push trigger above is deliberately `tags: ['**']` and not
          # `['*-v*']`. A filter that admits only well-formed tags does not
          # REJECT the malformed ones: it stops the workflow from running at
          # all, and this step with it, so a bare `v2.0.0` — which is exactly
          # what someone types out of habit after a run of `v1.x` releases —
          # would be skipped rather than failed. A release gate that
          # disappears when the tag is wrong is the shape this repository
          # exists to prevent, and the wrong tag is the case it most needs to
          # catch. The check belongs here, where a bad tag produces a named
          # failure, not in the trigger, where it produces silence. Fail
          # safe, never fail silent.
          ref="${GITHUB_REF#refs/tags/}"
          plugin="${ref%-v*}"
          tag="${ref##*-v}"
          [ "$plugin" != "$ref" ] || { echo "tag $ref is not <plugin>-v<version>"; exit 1; }
          [ -f "$plugin/.claude-plugin/plugin.json" ] || { echo "tag $ref names no plugin directory"; exit 1; }
          ver=$(jq -r '.version' "$plugin/.claude-plugin/plugin.json")
          [ "$tag" = "$ver" ] || { echo "tag $ref does not match $plugin $ver"; exit 1; }
