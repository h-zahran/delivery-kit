name: CI

on:
  push:
    branches: [main]
    # Every tag, and `**` rather than `*` because `*` does not match `/` in a
    # filter pattern. The tag step below is what rejects a tag that is not
    # <plugin>-v<version>; see the reasoning there for why that check is not
    # written as a trigger filter.
    tags: ['**']
  pull_request:

defaults:
  run:
    shell: bash

# This workflow clones and executes third-party code, and actions/checkout
# persists an auth token by default. It only ever needs to read the repository.
#
# WHERE that token lands moved in checkout v6: it is now written to a separate
# file under $RUNNER_TEMP rather than straight into .git/config. Read out of the
# v7 README, not inferred from the release note. The token is still persisted by
# default either way, and still removed in post-job cleanup, so this permissions
# block is what actually bounds the blast radius - not the storage location.
permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # bats-core v1.11.0.
      #
      # This is the COMMIT the release tag points AT, not the tag object's own
      # id. v1.11.0 is an ANNOTATED tag, so asking the upstream repository for
      # it returns two identifiers, and the one the obvious query prints first
      # is the tag object. Re-derive both with:
      #   git ls-remote https://github.com/bats-core/bats-core.git 'refs/tags/v1.11.0*'
      # and take the line whose ref carries the peel suffix.
      #
      # MEASURED 2026-08-30, because the obvious reason to prefer the commit is
      # wrong: BOTH identifiers fetch and check out fine — git peels the tag on
      # checkout, and HEAD lands on the same commit either way. The real reasons
      # are narrower and both hold. First, after checkout `git rev-parse HEAD`
      # returns the COMMIT, so a verification comparing HEAD against this value
      # only works when this value is the commit. Second, a tag object's id is a
      # hash of the tag's own metadata as well as its target, so re-tagging the
      # SAME code with a new message yields a NEW tag object id: the commit is
      # the more stable name for the code, which is what is being pinned.
      #
      # Pinned rather than cloned at the tag because a tag is MUTABLE: an
      # upstream retag would silently change third-party code this workflow
      # EXECUTES, with nothing here going red. The human-readable release name
      # stays in this comment so the pin does not become an opaque number.
      #
      # Declared once, at job level, because it is used twice below — as the
      # cache key and as the revision fetched. Two copies of a pin is the same
      # hand-maintained-twin hazard the version job just had removed.
      BATS_PIN: 5da66876b8b619235aee1eb3e54954eaca88059b
    steps:
      - uses: actions/checkout@v7

      - name: Ensure jq
        run: |
          if jq --version; then exit 0; fi
          case "${{ matrix.os }}" in
            ubuntu-latest)  sudo apt-get update && sudo apt-get install -y jq ;;
            macos-latest)   brew install jq ;;
            windows-latest) choco install jq -y ;;
          esac
          jq --version

      # Keyed on the pin, so changing BATS_PIN misses the cache with nobody
      # having to remember to invalidate it, and on the runner OS, because this
      # matrix runs three and one shared entry would restore one platform's
      # tree onto another.
      #
      # CORRECTED after review, because the first version of this comment was
      # wrong in the direction that misdirects a maintainer. It said a lost
      # executable bit "cannot break this dependency: the run step hands bats to
      # a shell rather than executing it". Handing bin/bats to a shell bypasses
      # the bit on THAT FILE ONLY — read the file: its last line is an `exec` of
      # $BATS_ROOT/libexec/bats-core/bats, which in turn execs the per-suite and
      # per-test binaries. A restore that dropped those bits would fail the test
      # step with "Permission denied" while this comment told the next reader
      # the outcome was impossible.
      #
      # Why it is nonetheless safe: the caching action stores and restores a tar
      # archive, and tar carries the mode bits. The verification step below is
      # what would catch a restore that arrived wrong.
      - name: Cache bats
        id: bats-cache
        uses: actions/cache@v4
        with:
          path: ~/bats
          key: bats-${{ runner.os }}-${{ env.BATS_PIN }}

      # A shallow clone takes a branch or a tag, never an arbitrary revision,
      # so fetching one commit means init-fetch-checkout rather than clone.
      # GitHub permits fetching a reachable revision by name, which is what
      # makes this shape work; if it ever stops, this step fails at the fetch
      # rather than quietly falling back to something mutable.
      #
      # actions/* above stays on a moving major version while this third-party
      # dependency is pinned to a commit. That is deliberate and not an
      # oversight: the platform's own actions are already referenced that way
      # throughout this file, and pinning one of them while the rest move would
      # be a false tidiness. Changing that policy is a decision about every
      # action here, not a side effect of pinning bats.
      - name: Install bats
        if: steps.bats-cache.outputs.cache-hit != 'true'
        run: |
          git init -q "$HOME/bats"
          git -C "$HOME/bats" fetch --depth 1 https://github.com/bats-core/bats-core.git "$BATS_PIN"
          git -C "$HOME/bats" checkout -q FETCH_HEAD

      # UNCONDITIONAL, and deliberately a step of its own rather than a line at
      # the end of the fetch. The fetch is skipped on a cache hit, which is the
      # COMMON path, so a check living inside it verifies only the uncommon one
      # — and the comment above justifies pinning the commit rather than the tag
      # object precisely on the grounds that HEAD can be compared against this
      # value. That comparison has to actually exist for the reasoning to be
      # true, and for a restored cache to be held to the same standard as a
      # fresh fetch.
      - name: Verify the bats checkout is the pinned commit
        run: |
          got="$(git -C "$HOME/bats" rev-parse HEAD)"
          [ "$got" = "$BATS_PIN" ] || {
            echo "bats is at $got, expected $BATS_PIN" >&2
            exit 1
          }
          # HEAD names a commit; it does not say the FILES match it. A restore that
          # arrived truncated, or was written with a modified tree at the right
          # revision, passes a rev-parse check and is then EXECUTED by the step below.
          # The pin exists so third-party code this workflow runs cannot change
          # unnoticed, and a tampered tree at the right HEAD is that same outcome
          # reached by a different door.
          #
          # --name-only tested for emptiness, NOT --quiet: measured, --quiet takes a
          # fast path that ignores --ignore-cr-at-eol, and the first version of this
          # check used it and reddened windows-latest on a CORRECT tree. The cache
          # round-trip leaves the working files with the line endings this platform
          # checks out, which is a legitimate difference and not a tamper.
          #
          # Untracked files are deliberately NOT checked. The upstream tree contains a
          # symlink this platform cannot materialise, so a clean checkout reports an
          # untracked entry of its own — a guard that fires on a correct tree is worse
          # than the gap it closes.
          changed="$(git -C "$HOME/bats" diff --ignore-cr-at-eol --name-only HEAD)"
          [ -z "$changed" ] || {
            echo "bats working tree does not match $got:" >&2
            echo "$changed" >&2
            exit 1
          }
          echo "bats verified at $got, tracked files match"

      # -r so a suite added in a subdirectory of one of these cannot be
      # silently skipped while CI stays green, and --print-output-on-failure
      # so a red test's output lands in the job log — the only diagnostic
      # channel a matrix runner has. The paths are named explicitly rather
      # than discovered, because a glob that matches nothing expands to
      # itself and bats would report "no such file" — loudly, but for the
      # wrong reason. A test in tests/portability.bats pins that every suite
      # directory is covered by this line — directly or via an ancestor,
      # since -r recurses — and polices the contributing guide's copy of the
      # same command.
      - name: Run the test suites
        run: bash "$HOME/bats/bin/bats" -r --print-output-on-failure tests handoff/tests pipeline/tests

  version:
    name: version agreement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ONE implementation, TWO callers. This step and the suite gate in
      # tests/portability.bats used to hold two copies of the walk this line
      # replaces, kept in step by hand. They drifted once — an unanchored regex
      # here read a changelog heading the suite copy rejected — and the drift
      # was invisible until a release. The logic now lives in
      # scripts/check-versions.sh and both callers invoke it, so there is no
      # pair left to keep in step.
      #
      # A test in tests/portability.bats pins that both callers name one script
      # AND that neither has grown an inline copy beside the call, so the
      # arrangement this comment describes cannot silently come apart again.
      #
      # The script asserts for itself that its working directory holds the
      # marketplace manifest, so running it from the workspace root is checked
      # rather than assumed.
      - name: every plugin's manifest, marketplace entry and changelog agree
        run: bash scripts/check-versions.sh

      - name: tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Tags are <plugin>-v<version> now. A marketplace can carry more than
          # one plugin entry, so a bare version tag names no manifest to check
          # against. The old `v*` filter would have matched a bare tag anyway,
          # and the step behind it read one fixed path — the root
          # `.claude-plugin/plugin.json` — which no longer exists now that each
          # plugin's manifest lives in its own directory. So it would not have
          # compared the wrong version: it would have died on a missing file
          # for any tag that reached it, reporting nothing about the tag.
          #
          # The push trigger above is deliberately `tags: ['**']` and not
          # `['*-v*']`. A filter that admits only well-formed tags does not
          # REJECT the malformed ones: it stops the workflow from running at
          # all, and this step with it, so a bare `v2.0.0` — which is exactly
          # what someone types out of habit after a run of `v1.x` releases —
          # would be skipped rather than failed. A release gate that
          # disappears when the tag is wrong is the shape this repository
          # exists to prevent, and the wrong tag is the case it most needs to
          # catch. The check belongs here, where a bad tag produces a named
          # failure, not in the trigger, where it produces silence. Fail
          # safe, never fail silent.
          ref="${GITHUB_REF#refs/tags/}"
          plugin="${ref%-v*}"
          tag="${ref##*-v}"
          [ "$plugin" != "$ref" ] || { echo "tag $ref is not <plugin>-v<version>"; exit 1; }
          [ -f "$plugin/.claude-plugin/plugin.json" ] || { echo "tag $ref names no plugin directory"; exit 1; }
          ver=$(jq -r '.version' "$plugin/.claude-plugin/plugin.json")
          [ "$tag" = "$ver" ] || { echo "tag $ref does not match $plugin $ver"; exit 1; }

  shell-analysis:
    name: shell analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same shape as "Ensure jq" in the test job: use what the image provides,
      # install it if absent, and always print the version. Be exact about how
      # far that uniformity goes — the `version` job below deliberately does
      # NEITHER, consuming jq straight from the runner image with no ensure
      # step, because it runs only on ubuntu where jq is guaranteed. So this
      # file carries two patterns, not one: ensure-then-use where a tool might
      # be missing, assume-the-image where it cannot be.
      #
      # The version print is what makes a red on unchanged code diagnosable in
      # one look: the analyser is the runner image's, and an image upgrade can
      # move it.
      #
      # THE VERSION HERE IS THE ONE THAT GOVERNS, and it is not necessarily the
      # one a contributor has. Measured 2026-08-30, the hard way: this image
      # shipped 0.9.0 while the machine the job was written on had 0.11.0, and
      # 0.9.0 reports a check 0.11.0 does not have at any severity. The job went
      # red on a tree that was clean locally, twice over — once on new code and
      # once on a line that predated the job entirely.
      #
      # Note the direction, because it is the dangerous one: a contributor with
      # a NEWER analyser sees FEWER findings than this gate does. Read the
      # version this step prints before concluding a local green means anything,
      # and see CONTRIBUTING.md for how to match it.
      - name: Ensure shellcheck
        run: |
          if shellcheck --version; then exit 0; fi
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --version

      # WHAT IS ANALYSED, and why the boundary sits where it does. Read this
      # before widening or narrowing it.
      #
      # The set is DISCOVERED, never listed. A list of filenames goes stale
      # silently the first time a shell file is added and nobody remembers the
      # list — and it would have gone stale in the very commit that introduced
      # it, which also added scripts/check-versions.sh. Discovery covers a new
      # file on the day it lands, and covering that script is this rule's own
      # first proof.
      #
      # OUT: .specify/scripts/bash/ — vendored scaffold, not authored here and
      # regenerated whenever its upstream tool is re-run, so a fix made to it is
      # discarded on the next upgrade. Measured 2026-08-30 WITH ANALYSER 0.9.0,
      # the version this image ships — every count in this comment is relative
      # to it, and a different version yields different numbers, as this job
      # learned on its first run: about ten finding
      # lines across four identifiers, and it already carries the repository's
      # only pre-existing suppression directive. Fixing code that will be
      # overwritten produces nothing.
      #
      # OUT: the .bats suites. The analyser DOES read them — this is not an
      # extension it cannot parse — and measured 2026-08-30 it reports 55
      # findings over the six of them. The distribution is the reason, not the
      # count: over half are reports about single quotes preventing expansion,
      # which is exactly what a pattern fixture wants, and several are unquoted
      # expansions in the leak scanners, where word splitting is the mechanism
      # rather than a mistake. Bringing them in is separate work with its own
      # suppression budget and its own review.
      #
      # OUT, and this exclusion was missing from the list until review pointed
      # at it: the inline `run:` shell in THIS FILE. The discovery matches
      # tracked files by extension, and a workflow is YAML, so no shell inside
      # it is analysed — including the release-tag step below, which parses a
      # tag reference and is the only release gate the repository has. That is
      # the largest and most security-relevant block of inline shell in the
      # tree, and a reader who saw only the two exclusions above would fairly
      # conclude the rest was covered. Closing it needs a different tool, one
      # that extracts `run:` blocks from workflow YAML; that is separate work,
      # and naming the gap is the minimum owed until then.
      #
      # There is NO job-level suppression list. The one finding this repository
      # had is suppressed at its own line in tests/helper.bash, with the reader
      # named. An empty list here is the strongest available reading of "keep
      # any disable list short and explicit".
      #
      # An empty discovery is a FAILURE, not a pass. A scan that read nothing
      # and a scan that found nothing otherwise report the same clean result,
      # and this repository has been bitten by that shape before.
      #
      # --norc, and it is load bearing. Without it shellcheck reads a
      # .shellcheckrc from the directory of each analysed file and every
      # ancestor, so a four-line rc saying `disable=all` at the repository root
      # turns this job green PERMANENTLY — while it still prints "analysing 5
      # file(s):" and lists all five. Measured 2026-08-30, both directions.
      # That needs no attacker: a maintainer adding an rc for editor parity
      # does it. The empty-discovery guard below does not cover it, because
      # discovery is not what was neutered. Inline `# shellcheck disable=`
      # directives are unaffected by --norc — also measured, because the one
      # suppression this repository has is inline and had to survive.
      #
      # NUL-delimited into an array, never a whitespace-split string: a tracked
      # path containing a space would otherwise be analysed as two files that do
      # not exist, and shellcheck would fail for the wrong reason.
      - name: Analyse the first-party shell files
        run: |
          mapfile -d '' files < <(git ls-files -z -- '*.sh' '*.bash' ':(exclude).specify/')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "the discovery matched no shell file; this job examined NOTHING" >&2
            exit 1
          fi
          printf 'analysing %s file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          shellcheck --norc -f gcc -- "${files[@]}"
