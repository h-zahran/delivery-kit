name: CI

on:
  push:
    branches: [main]
    # Every tag, and `**` rather than `*` because `*` does not match `/` in a
    # filter pattern. The tag step below is what rejects a tag that is not
    # <plugin>-v<version>; see the reasoning there for why that check is not
    # written as a trigger filter.
    #
    # ONE ROUTE PAST THIS TRIGGER CANNOT BE CLOSED FROM INSIDE THE WORKFLOW.
    # GitHub skips a push-triggered run entirely when the head commit's message
    # carries `[skip ci]`, `[ci skip]`, `[no ci]` or `[skip actions]`. A tag
    # pointing at such a commit runs nothing, and the release gate below never
    # fires — the same "gate that disappears" outcome the tag step argues
    # against for trigger filters, arriving by a different door. No `if:`, no
    # trigger and no step can prevent it, because the skip happens before the
    # workflow is scheduled at all.
    #
    # Two things bound it. Nothing here publishes, so a skipped run withholds a
    # report rather than releasing anything unchecked. And the lever that WOULD
    # close it is outside this file: making these checks required for the branch
    # in repository settings, or confirming at release time that the tag's run
    # exists. Recorded rather than silently tolerated; verify with
    # `gh run list --limit 5` after pushing a tag.
    #
    # DEMONSTRATED, not theorised, on 2026-09-03. The commit that first wrote
    # the paragraph above quoted the directive verbatim in its own message while
    # explaining it. GitHub read the quotation as the instruction, skipped the
    # entire run, and the pull request sat with ZERO checks and a mergeable
    # state — the "gate that disappears" outcome, produced by the commit
    # documenting it. Nothing was wrong with this file; `gh api .../check-runs`
    # returned total_count 0 and no run existed for the branch at all.
    #
    # The operational rule that follows: **never write the directive literally
    # into a commit message**, in any of its spellings, even inside quotes, even
    # while explaining it. Describe it instead. A file may contain it freely —
    # this comment does — because GitHub scans commit messages, not file
    # contents. And a pull request whose checks never appear is not necessarily
    # passing: an absent check and a green one look identical in a merge button,
    # which is the whole reason this hazard is written down here.
    tags: ['**']
  pull_request:

defaults:
  run:
    shell: bash

# This workflow clones and executes third-party code, and actions/checkout
# persists an auth token by default. It only ever needs to read the repository.
#
# WHERE that token lands moved in checkout v6: it is now written to a separate
# file under $RUNNER_TEMP rather than straight into .git/config. Read out of the
# v7 README, not inferred from the release note. The token is still persisted by
# default either way, and still removed in post-job cleanup, so this permissions
# block is what actually bounds the blast radius - not the storage location.
permissions:
  contents: read

# A newer push to the same pull request makes the older run's answer worthless,
# so that run is cancelled rather than left to occupy a runner — the windows
# leg alone is several minutes. Push runs (main) and tag runs are NOT cancelled
# in progress: a main run is the record of what landed, and a tag run is the
# release gate, so neither may be stopped by whatever arrives after it.
#
# Be exact about the limit, because "never cancelled" would overstate it: the
# group is per ref, and GitHub keeps at most ONE PENDING run per group. A main
# run that is still QUEUED when another push to main arrives is replaced by
# the newer one, which checks a superset of it. A RUNNING main run is never
# touched, and each tag is its own ref, so its group holds only itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# jq 1.8.2, PINNED on every runner that runs repository code, for the reason
# shellcheck is pinned below: a version nobody chose is a version nobody can
# match. Measured 2026-10-06, before this pin, the images carried three (ubuntu
# 1.7, macOS 1.8.2, windows 1.8.1), and the release gate ran on 1.7, which no
# contributor used. The scripts depend on `jq -b` on Windows (native jq writes
# CRLF without it); the 1.8.2 Windows build was checked to honour it.
#
# Declared ONCE, here, because two jobs read it: the test legs and the version
# job. The install and verify steps are written once too, in the test job, and
# reused in the version job by YAML alias, so there is no second copy of the
# install logic to drift.
#
# Each checksum is of the named asset of the jqlang/jq GitHub release
# jq-1.8.2, derived 2026-10-11 by downloading the asset and hashing it, and
# cross-checked against BOTH the release's sha256sum.txt and the sha256 digest
# GitHub records for the asset in the release API; all three agreed. Re-derive
# all three ways when bumping; never copy a checksum from anywhere that did not
# hash the file.
env:
  JQ_VERSION: '1.8.2'
  JQ_SHA256_LINUX_AMD64: b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f
  JQ_SHA256_MACOS_ARM64: 2d75340ba57a4b4b4c8708a21c2dc8e958a48aaa8bba13b27f77f6e4c0eca07e
  JQ_SHA256_WINDOWS_AMD64: a6fc67fedaf9128a3309a1e2ebb8b986aeccf70122ee46d2cb4849e423f0c627

# EVERY JOB CARRIES A timeout-minutes. The default is 360, so a hung step —
# a test waiting on stdin, a network fetch that never returns — would hold a
# runner for six hours before anything went red. Each limit is set well above
# the slowest duration measured for that job, so an ordinary slow runner never
# trips it and a hang is still reported in minutes. The figure, its source and
# the resulting ratio are written beside each limit, not here, so no single
# multiplier is claimed for limits whose ratios differ.
#
# RUNNER IMAGES ARE PINNED BY LABEL, never `-latest`. A `-latest` label moves
# to a new OS release on GitHub's schedule, which changes bash, coreutils and
# the preinstalled tools under an unchanged tree, so a red would arrive with no
# commit to blame. The labels below are the ones `-latest` mapped to on
# 2026-10-11, read from the actions/runner-images README: ubuntu-latest ->
# ubuntu-24.04, macos-latest -> macos-26 (arm64), windows-latest ->
# windows-2025. Moving to a newer image is now a commit, made on purpose.
jobs:
  test:
    name: tests (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    # SHARDED ACROSS RUNNER VMs, one job per OS per suite root, rather than
    # `bats --jobs` on one VM. Parallel tests on one machine add exactly the
    # load that already pushes Windows tests toward their 60 s timeout; a shard
    # runs its tests serially on a VM of its own, so each test sees the load it
    # saw before and the wall time is the slowest shard, not the sum.
    #
    # The matrix is a full cross product: there is no `exclude:`, and the
    # `include:` entries below only ADD a key to the combinations whose os
    # matches, so every suite root runs on every OS. tests/portability.bats
    # pins what can be read from this file: the suite list covers every
    # tracked .bats file, with no entry repeated, nested in another, or `.`;
    # there is no `exclude:`; no `continue-on-error:` anywhere in this job;
    # and no `if:` on the job or on its shard step. It cannot see a
    # combination lost some other way, such as a label no runner serves.
    #
    # Per OS, because the legs differ by an order of magnitude.
    #
    # WINDOWS: 40. Measured 2026-10-11 in review, from the bats step of the
    # last ten green UNSHARDED runs: the whole suite took 1028-1566 s, and the
    # pipeline/tests part of it alone 763-1168 s (the 1168 s is run
    # 38139381767). pipeline/tests is the slowest shard, so 1168 s (19.5 min)
    # is the governing figure; 40 minutes is about 2x it, with room for setup.
    # The first sharded run, 38167376375, took 11.6 min for its slowest
    # Windows job. An earlier version of this comment quoted 275-511 s for the
    # whole Windows suite; that figure was wrong, and the 20-minute limit
    # derived from it sat at 97% of a measured shard.
    #
    # macOS and ubuntu: 10. Their figures are carried from the earlier comment,
    # not re-measured here: whole suite, ten runs before 2026-10-06, macOS
    # 83-159 s and ubuntu 30-45 s. On them, 10 minutes is about 3.8x the
    # slowest whole macOS suite, which bounds every macOS shard, and it absorbs
    # a bats cache miss and the jq download. Re-derive all three limits from
    # the sharded runs' own durations once a few have accumulated.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
        suite: [tests, handoff/tests, pipeline/tests]
        include:
          - os: ubuntu-24.04
            timeout: 10
          - os: macos-26
            timeout: 10
          - os: windows-2025
            timeout: 40
    env:
      # bats-core v1.11.0.
      #
      # This is the COMMIT the release tag points AT, not the tag object's own
      # id. v1.11.0 is an ANNOTATED tag, so asking the upstream repository for
      # it returns two identifiers, and the one the obvious query prints first
      # is the tag object. Re-derive both with:
      #   git ls-remote https://github.com/bats-core/bats-core.git 'refs/tags/v1.11.0*'
      # and take the line whose ref carries the peel suffix.
      #
      # MEASURED 2026-08-30, because the obvious reason to prefer the commit is
      # wrong: BOTH identifiers fetch and check out fine — git peels the tag on
      # checkout, and HEAD lands on the same commit either way. The real reasons
      # are narrower and both hold. First, after checkout `git rev-parse HEAD`
      # returns the COMMIT, so a verification comparing HEAD against this value
      # only works when this value is the commit. Second, a tag object's id is a
      # hash of the tag's own metadata as well as its target, so re-tagging the
      # SAME code with a new message yields a NEW tag object id: the commit is
      # the more stable name for the code, which is what is being pinned.
      #
      # Pinned rather than cloned at the tag because a tag is MUTABLE: an
      # upstream retag would silently change third-party code this workflow
      # EXECUTES, with nothing here going red. The human-readable release name
      # stays in this comment so the pin does not become an opaque number.
      #
      # Declared once, at job level, because it is used twice below — as the
      # cache key and as the revision fetched. Two copies of a pin is the same
      # hand-maintained-twin hazard the version job just had removed.
      BATS_PIN: 5da66876b8b619235aee1eb3e54954eaca88059b
    steps:
      - uses: actions/checkout@v7

      # The pinned jq (JQ_VERSION, workflow env), same shape as the shellcheck
      # install: the asset is fetched from the official release, FAILS CLOSED
      # on its checksum, and is never made executable unless it matches.
      #
      # The asset is chosen by the runner's OS AND architecture, and anything
      # else is refused by name rather than handed the wrong binary. macos-26
      # is arm64; a move to an Intel image would land in the refusal, not in an
      # unverified download.
      #
      # sha256sum where it exists, `shasum -a 256` otherwise (macOS ships the
      # second, not always the first); both read stdin, for the backslash
      # reason given at the shellcheck install. On Windows the directory goes
      # to GITHUB_PATH in Windows form, which the runner prepends for later
      # steps, and the file ops here use the POSIX form Git Bash prefers.
      #
      # Anchored, and reused in the version job by alias: one copy of the
      # install logic for both jobs.
      - &install-jq
        name: Install the pinned jq
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)   asset=jq-linux-amd64;       want="$JQ_SHA256_LINUX_AMD64";   exe=jq ;;
            macOS-ARM64) asset=jq-macos-arm64;       want="$JQ_SHA256_MACOS_ARM64";   exe=jq ;;
            Windows-X64) asset=jq-windows-amd64.exe; want="$JQ_SHA256_WINDOWS_AMD64"; exe=jq.exe ;;
            *) echo "no pinned jq asset for $RUNNER_OS-$RUNNER_ARCH; refusing to guess one" >&2; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/jq-$JQ_VERSION"
          if command -v cygpath >/dev/null 2>&1; then dir="$(cygpath -u "$dir")"; fi
          mkdir -p "$dir"
          url="https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/${asset}"
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 -o "$dir/$exe" "$url"
          if command -v sha256sum >/dev/null 2>&1; then
            got="$(sha256sum < "$dir/$exe" | cut -d' ' -f1)"
          else
            got="$(shasum -a 256 < "$dir/$exe" | cut -d' ' -f1)"
          fi
          [ "$got" = "$want" ] || {
            rm -f "$dir/$exe"
            echo "jq $JQ_VERSION asset $asset hashes to $got, expected $want; refusing to install it" >&2
            exit 1
          }
          echo "jq $JQ_VERSION asset $asset matches $want"
          chmod +x "$dir/$exe"
          have="$("$dir/$exe" --version | tr -d '\r')"
          [ "$have" = "jq-$JQ_VERSION" ] || {
            echo "the verified jq asset reports '$have', expected jq-$JQ_VERSION" >&2
            exit 1
          }
          if command -v cygpath >/dev/null 2>&1; then
            cygpath -w "$dir" >> "$GITHUB_PATH"
          else
            echo "$dir" >> "$GITHUB_PATH"
          fi

      # A step of its own because GITHUB_PATH takes effect in LATER steps only.
      # This is the assertion that the jq every later step resolves is the
      # pinned one and not the image's copy, which is still installed further
      # down PATH.
      - &check-jq
        name: Verify the pinned jq is the one on PATH
        run: |
          have="$(jq --version | tr -d '\r')"
          [ "$have" = "jq-$JQ_VERSION" ] || {
            echo "jq on PATH is '$have' at $(command -v jq), expected the pinned jq-$JQ_VERSION" >&2
            exit 1
          }
          echo "jq is $have from $(command -v jq)"

      # Keyed on the pin, so changing BATS_PIN misses the cache with nobody
      # having to remember to invalidate it, and on the runner OS, because this
      # matrix runs three operating systems and one shared entry would restore
      # one platform's tree onto another. The suite shards of one OS share the
      # entry, which is right: they run the same bats.
      #
      # CORRECTED after review, because the first version of this comment was
      # wrong in the direction that misdirects a maintainer. It said a lost
      # executable bit "cannot break this dependency: the run step hands bats to
      # a shell rather than executing it". Handing bin/bats to a shell bypasses
      # the bit on THAT FILE ONLY — read the file: its last line is an `exec` of
      # $BATS_ROOT/libexec/bats-core/bats, which in turn execs the per-suite and
      # per-test binaries. A restore that dropped those bits would fail the test
      # step with "Permission denied" while this comment told the next reader
      # the outcome was impossible.
      #
      # Why it is nonetheless safe: the caching action stores and restores a tar
      # archive, and tar carries the mode bits. The verification step below is
      # what would catch a restore that arrived wrong.
      - name: Cache bats
        id: bats-cache
        uses: actions/cache@v4
        with:
          path: ~/bats
          key: bats-${{ runner.os }}-${{ env.BATS_PIN }}

      # A shallow clone takes a branch or a tag, never an arbitrary revision,
      # so fetching one commit means init-fetch-checkout rather than clone.
      # GitHub permits fetching a reachable revision by name, which is what
      # makes this shape work; if it ever stops, this step fails at the fetch
      # rather than quietly falling back to something mutable.
      #
      # actions/* above stays on a moving major version while this third-party
      # dependency is pinned to a commit. That is deliberate and not an
      # oversight: the platform's own actions are already referenced that way
      # throughout this file, and pinning one of them while the rest move would
      # be a false tidiness. Changing that policy is a decision about every
      # action here, not a side effect of pinning bats.
      - name: Install bats
        if: steps.bats-cache.outputs.cache-hit != 'true'
        run: |
          git init -q "$HOME/bats"
          git -C "$HOME/bats" fetch --depth 1 https://github.com/bats-core/bats-core.git "$BATS_PIN"
          git -C "$HOME/bats" checkout -q FETCH_HEAD

      # UNCONDITIONAL, and deliberately a step of its own rather than a line at
      # the end of the fetch. The fetch is skipped on a cache hit, which is the
      # COMMON path, so a check living inside it verifies only the uncommon one
      # — and the comment above justifies pinning the commit rather than the tag
      # object precisely on the grounds that HEAD can be compared against this
      # value. That comparison has to actually exist for the reasoning to be
      # true, and for a restored cache to be held to the same standard as a
      # fresh fetch.
      - name: Verify the bats checkout is the pinned commit
        run: |
          got="$(git -C "$HOME/bats" rev-parse HEAD)"
          [ "$got" = "$BATS_PIN" ] || {
            echo "bats is at $got, expected $BATS_PIN" >&2
            exit 1
          }
          echo "bats is at $got"

      # HEAD names a commit; it does not say the FILES match it. A restore that
      # arrived truncated, or was written with a modified tree at the right
      # revision, passes the check above and is then EXECUTED by the step below.
      #
      # NOT run on windows, and the reason is a property of the DEPENDENCY meeting
      # a property of the RUNNER — not a shortcut. Measured on CI, twice, each
      # time by reddening a correct tree: the upstream tree contains symlinks
      # (test/fixtures/parallel/setup_file/*.bats and
      # test/fixtures/suite/recursive_with_symlinks/subsuite), and this runner's
      # git cannot create them, so it writes ordinary files holding the target
      # path and then reports a CLEAN checkout as modified.
      #
      # Be exact, because "windows" alone is the wrong reason and would mislead:
      # a windows checkout with core.symlinks=true materialises them and reports
      # nothing — verified on a windows development machine, where this check
      # passes. It is symlink support, not the operating system, that decides.
      # The condition names the OS because that is what the runner exposes; if a
      # future image enables symlink creation, this exclusion can go.
      #
      # There is no flag that quiets it, because the difference is real — only
      # its meaning differs. A guard that fires on a correct tree is worse than
      # the gap it leaves, so the gap is named here rather than papered over.
      #
      # --name-only tested for emptiness, not --quiet: --quiet takes a fast path
      # that ignores --ignore-cr-at-eol, and that flag is what keeps this quiet
      # on a platform that checks out different line endings.
      - name: Verify the bats working tree matches the pin
        if: runner.os != 'Windows'
        run: |
          changed="$(git -C "$HOME/bats" diff --ignore-cr-at-eol --name-only HEAD)"
          [ -z "$changed" ] || {
            echo "bats working tree does not match $BATS_PIN:" >&2
            echo "$changed" >&2
            exit 1
          }
          echo "bats tracked files match $BATS_PIN"

      # ONE suite root per shard, named by the matrix and passed through the
      # environment rather than spliced into the script text.
      #
      # bats exiting 0 is NOT taken as proof the shard ran its tests, because
      # two measured shapes report green while running less than they count:
      # bats 1.11.0 puts a test whose name has a non-ASCII character in the
      # plan line and then skips it with no failure line, and a skip is an ok
      # line. So the TAP is kept and read back, and the shard FAILS unless
      #   - a plan line exists and plans at least one test (a shard that ran
      #     nothing must never be green),
      #   - no test was skipped,
      #   - no test reported not ok (whatever bats exited with), and
      #   - the result lines number exactly 1..N, each once, for a plan of
      #     1..N: a matching COUNT is not enough, since a stray or repeated
      #     number could stand in for a test that never ran.
      #
      # --timing adds " in Nms" to every result line (measured with the pinned
      # bats writing to a pipe; its tap formatter spells it " # in N ms", and
      # the reader accepts both). A test over 30 s (the
      # per-test budget the suites name in their comments; bats kills a test at
      # 60) gets a GitHub warning annotation and DOES NOT fail the job: slow is
      # a thing to see before it becomes a timeout, not a failure in itself.
      #
      # tee, so the log streams live and a job killed by its timeout still shows
      # how far it got. The pipeline's status is read from PIPESTATUS with
      # errexit off around it, because a pipe otherwise reports the status of
      # its LAST command, and tee always succeeds. The TAP goes to a mktemp
      # file, a POSIX path on every runner.
      - name: Run the ${{ matrix.suite }} suite
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          tap="$(mktemp)"
          set +e
          bash "$HOME/bats/bin/bats" -r --print-output-on-failure --timing "$SUITE" 2>&1 | tee "$tap"
          rc="${PIPESTATUS[0]}"
          set -e
          awk -v suite="$SUITE" -v limit=30000 '
            /^(not )?ok [0-9]+ / && match($0, / (# )?in [0-9]+ ?ms$/) {
              name = substr($0, 1, RSTART - 1)
              ms = substr($0, RSTART, RLENGTH)
              gsub(/[^0-9]/, "", ms)
              ms += 0
              if (ms > limit) {
                sub(/^(not )?ok /, "test ", name)
                gsub(/%/, "%25", name)
                printf "::warning title=slow test in %s::%s took %d ms, over the %d ms budget\n", suite, name, ms, limit
              }
            }
          ' "$tap"
          plan="$(grep -m1 -E '^1[.][.][0-9]+$' "$tap" || true)"
          planned="${plan#1..}"
          passed="$(grep -cE '^ok [0-9]+ ' "$tap" || true)"
          failed="$(grep -cE '^not ok [0-9]+ ' "$tap" || true)"
          skipped="$(grep -cE '^ok [0-9]+ .* # skip( |$)' "$tap" || true)"
          echo "$SUITE: plan ${plan:-<none>}, $passed ok (of which $skipped skipped), $failed not ok, bats exit $rc"
          if [ -z "$plan" ] || [ "$planned" -eq 0 ]; then
            echo "::error title=empty shard::$SUITE planned no test; a shard that ran nothing is not a pass"
            exit 1
          fi
          if [ "$skipped" -ne 0 ]; then
            echo "::error title=skipped tests::$SUITE skipped $skipped test(s); a skip is a failure here"
            exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error title=failed tests::$SUITE reported $failed not-ok test(s)"
            exit 1
          fi
          numbering="$(awk -v n="$planned" '
            /^(not )?ok [0-9]+ / {
              k = ($1 == "not") ? $3 : $2
              k += 0
              if (k < 1 || k > n || seen[k]++) bad = 1
              c++
            }
            END { print ((bad || c != n) ? "bad" : "ok") }
          ' "$tap")"
          if [ "$((passed + failed))" -ne "$planned" ] || [ "$numbering" != ok ]; then
            echo "::error title=plan mismatch::$SUITE planned tests 1..$planned but reported $((passed + failed)) result(s) (numbering check: $numbering); some were counted and never run"
            exit 1
          fi
          exit "$rc"

  version:
    name: version agreement
    runs-on: ubuntu-24.04
    # Measured 4-7 s over ten runs before the jq download was added; 5 minutes
    # is about 40x that, deliberately loose because the download and its
    # retries are network time no run has measured yet. Still bounded.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # The release gate reads manifests with jq, so it runs on the SAME pinned
      # jq as the test legs: the two steps defined in the test job, reused by
      # alias. Before the pin this job took the image's jq (1.7, measured
      # 2026-10-06), a version no contributor ran.
      - *install-jq
      - *check-jq

      # ONE implementation, TWO callers. This step and the suite gate, now in
      # tests/gate.bats, used to hold two copies of the walk this line
      # replaces, kept in step by hand. They drifted once — an unanchored regex
      # here read a changelog heading the suite copy rejected — and the drift
      # was invisible until a release. The logic now lives in
      # scripts/check-versions.sh and both callers invoke it, so there is no
      # pair left to keep in step.
      #
      # A test in tests/gate.bats pins that both callers name one script
      # AND that neither has grown an inline copy beside the call, so the
      # arrangement this comment describes cannot silently come apart again.
      #
      # The script asserts for itself that its working directory holds the
      # marketplace manifest, so running it from the workspace root is checked
      # rather than assumed.
      # On a release tag this ALSO requires the tagged plugin's changelog to
      # carry no heading above its version heading, and no line beginning `## `
      # anywhere in it that is not a dated version heading.
      # Until 1.2.0 / 2.1.1 nothing in the repository could tell a released
      # tree from an unreleased one: the agreement walk reads with `grep -m1`
      # against a date-anchored pattern, so an `## [Unreleased]` heading is
      # SKIPPED rather than rejected and the previous release is read in its
      # place. Both plugins carried an open heading through a whole release
      # cycle while this step printed agreement.
      #
      # The argument is built into "$@" and the script is invoked ONCE. Two
      # `bash scripts/check-versions.sh` lines — one per branch of a case — would
      # redden the suite's "one version-agreement script, and both gates call it"
      # test, which requires exactly one such invocation in this file and is the
      # thing standing between these two callers and the drift that already
      # happened once.
      #
      # Only the plugin being released is checked. Tagging pipeline says nothing
      # about whether handoff has unreleased work, and unreleased work is the
      # normal condition of this repository.
      - name: every plugin's manifest, marketplace entry and changelog agree
        run: |
          set --
          case "${GITHUB_REF}" in
            refs/tags/*)
              ref="${GITHUB_REF#refs/tags/}"
              set -- --released "${ref%-v*}"
              ;;
          esac
          bash scripts/check-versions.sh "$@"

      - name: tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Tags are <plugin>-v<version> now. A marketplace can carry more than
          # one plugin entry, so a bare version tag names no manifest to check
          # against. The old `v*` filter would have matched a bare tag anyway,
          # and the step behind it read one fixed path — the root
          # `.claude-plugin/plugin.json` — which no longer exists now that each
          # plugin's manifest lives in its own directory. So it would not have
          # compared the wrong version: it would have died on a missing file
          # for any tag that reached it, reporting nothing about the tag.
          #
          # The push trigger above is deliberately `tags: ['**']` and not
          # `['*-v*']`. A filter that admits only well-formed tags does not
          # REJECT the malformed ones: it stops the workflow from running at
          # all, and this step with it, so a bare `v2.0.0` — which is exactly
          # what someone types out of habit after a run of `v1.x` releases —
          # would be skipped rather than failed. A release gate that
          # disappears when the tag is wrong is the shape this repository
          # exists to prevent, and the wrong tag is the case it most needs to
          # catch. The check belongs here, where a bad tag produces a named
          # failure, not in the trigger, where it produces silence. Fail
          # safe, never fail silent.
          ref="${GITHUB_REF#refs/tags/}"
          plugin="${ref%-v*}"
          tag="${ref##*-v}"
          [ "$plugin" != "$ref" ] || { echo "tag $ref is not <plugin>-v<version>"; exit 1; }
          # An EMPTY plugin name passes the test above, because the empty string
          # differs from the ref. Measured: a tag of `-v1.2.0` yields plugin=""
          # and the -f test below then stats /.claude-plugin/plugin.json — the
          # filesystem ROOT, outside the workspace entirely. On a runner that
          # file is absent so the step fails, but it fails by accident of the
          # filesystem rather than by design, and check-versions.sh spends a
          # paragraph explaining why an accident is not a guard. `-v1.2.0` is a
          # legal ref: `git tag` refuses it, but `git update-ref` followed by an
          # explicit refspec push creates it.
          [ -n "$plugin" ] || { echo "tag $ref has an empty plugin name"; exit 1; }
          # The ./ prefix and the -- guard, for the reason check-versions.sh
          # gives at its own plugin loop: a tracked directory named like an
          # option (-rf, say, which `git check-ref-format` accepts) otherwise
          # reaches jq as an OPTION rather than as a path. The -f test currently
          # blocks that, so this is defence in depth — but this block is, by
          # ci.yml's own description, the only release gate the repository has,
          # and its shell reaches shellcheck only by way of actionlint in the
          # shell-analysis job, not through that job's file discovery.
          [ -f "./$plugin/.claude-plugin/plugin.json" ] || { echo "tag $ref names no plugin directory"; exit 1; }
          ver=$(jq -r '.version' -- "./$plugin/.claude-plugin/plugin.json")
          [ "$tag" = "$ver" ] || { echo "tag $ref does not match $plugin $ver"; exit 1; }

  shell-analysis:
    name: shell analysis
    runs-on: ubuntu-24.04
    # Measured 4-7 s over ten runs, before the analysers were downloaded here.
    # 10 minutes is about 85x that, deliberately loose: it is there for the two
    # downloads' retries on a bad network day, which no run has measured.
    timeout-minutes: 10
    # Declared once, at job level, because two steps read each: the install
    # step fetches and verifies the release, and the step that uses it refuses
    # to run under any other version. Same reasoning as BATS_PIN above.
    #
    # actionlint 1.7.12: the checksum is of the release asset
    # actionlint_1.7.12_linux_amd64.tar.gz from the rhysd/actionlint GitHub
    # release v1.7.12, derived 2026-10-11 by downloading and hashing it, and
    # cross-checked against the release's actionlint_1.7.12_checksums.txt and
    # the sha256 digest GitHub records for the asset; all three agreed.
    #
    # The checksum is of the release asset shellcheck-v0.11.0.linux.x86_64.tar.xz
    # from the koalaman/shellcheck GitHub release. Derived 2026-10-06 by
    # downloading the asset and hashing it, and cross-checked against the
    # sha256 digest GitHub records for that asset in the release API — the two
    # agreed. Re-derive both when bumping the version; never copy a checksum
    # from anywhere that did not hash the file.
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
      ACTIONLINT_VERSION: '1.7.12'
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v7

      # PINNED, not taken from the runner image, and this is why. Measured
      # 2026-08-30, the hard way: this image shipped 0.9.0 while the machine
      # the job was written on had 0.11.0, and 0.9.0 reports a check 0.11.0
      # does not have at any severity. The job went red on a tree that was
      # clean locally, twice over — once on new code and once on a line that
      # predated the job entirely. Note the direction, because it is the
      # dangerous one: a contributor with a NEWER analyser saw FEWER findings
      # than this gate did. An image upgrade could equally move the analyser
      # under unchanged code. A pin makes the governing version a line in this
      # file that a contributor can read and match (see CONTRIBUTING.md).
      #
      # FAIL CLOSED on the checksum: a tarball that hashes to anything else is
      # never unpacked, let alone executed. The comparison is explicit, and
      # names both values, rather than resting on errexit alone.
      #
      # The install directory is put on GITHUB_PATH, which takes effect in
      # LATER steps only, so the version printed here is the extracted binary's
      # by absolute path. A bare `shellcheck --version` in this step would
      # still print the image's copy and mislead the reader of this log. The
      # analysis step below asserts the version it actually resolves.
      - name: Install the pinned shellcheck
        run: |
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tarball="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 -o "$tarball" "$url"
          # From stdin, not by name: GNU sha256sum prefixes the hash with a
          # backslash when the FILENAME contains one, which made this exact
          # comparison refuse a correct tarball in a local rehearsal (2026-10-06).
          got="$(sha256sum < "$tarball" | cut -d' ' -f1)"
          [ "$got" = "$SHELLCHECK_SHA256" ] || {
            echo "shellcheck ${SHELLCHECK_VERSION} tarball hashes to $got, expected $SHELLCHECK_SHA256; refusing to install it" >&2
            exit 1
          }
          echo "shellcheck ${SHELLCHECK_VERSION} tarball matches $SHELLCHECK_SHA256"
          tar -xJf "$tarball" -C "$RUNNER_TEMP"
          dir="$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}"
          "$dir/shellcheck" --version
          echo "$dir" >> "$GITHUB_PATH"

      # WHAT IS ANALYSED, and why the boundary sits where it does. Read this
      # before widening or narrowing it.
      #
      # The set is DISCOVERED, never listed. A list of filenames goes stale
      # silently the first time a shell file is added and nobody remembers the
      # list — and it would have gone stale in the very commit that introduced
      # it, which also added scripts/check-versions.sh. Discovery covers a new
      # file on the day it lands, and covering that script is this rule's own
      # first proof.
      #
      # OUT: .specify/scripts/bash/ — vendored scaffold, not authored here and
      # regenerated whenever its upstream tool is re-run, so a fix made to it is
      # discarded on the next upgrade. Measured 2026-08-30 WITH ANALYSER 0.9.0,
      # the version this image shipped before the pin above — every count in
      # this comment is relative to it, and a different version yields
      # different numbers, as this job learned on its first run: about ten finding
      # lines across four identifiers, and it already carries the repository's
      # only pre-existing suppression directive. Fixing code that will be
      # overwritten produces nothing.
      #
      # OUT: the .bats suites. The analyser DOES read them — this is not an
      # extension it cannot parse — and measured 2026-08-30 it reports 55
      # findings over the six of them. The distribution is the reason, not the
      # count: over half are reports about single quotes preventing expansion,
      # which is exactly what a pattern fixture wants, and several are unquoted
      # expansions in the leak scanners, where word splitting is the mechanism
      # rather than a mistake. Bringing them in is separate work with its own
      # suppression budget and its own review.
      #
      # NOT HERE, BUT NOT UNREAD: the inline `run:` shell in THIS FILE. The
      # discovery matches tracked files by extension, and a workflow is YAML,
      # so this step reads no shell inside it — including the release-tag step
      # in the version job, which parses a tag reference and is the only
      # release gate the repository has. Until 2026-10-11 nothing read that
      # block at all, and this comment said so. The last step of this job now
      # runs actionlint, which extracts every `run:` block from the workflows
      # and hands each to this same pinned shellcheck. See that step for what
      # it proves and what it does not.
      #
      # There is NO job-level suppression list. The one finding this repository
      # had is suppressed at its own line in tests/helper.bash, with the reader
      # named. An empty list here is the strongest available reading of "keep
      # any disable list short and explicit".
      #
      # An empty discovery is a FAILURE, not a pass. A scan that read nothing
      # and a scan that found nothing otherwise report the same clean result,
      # and this repository has been bitten by that shape before.
      #
      # --norc, and it is load bearing. Without it shellcheck reads a
      # .shellcheckrc from the directory of each analysed file and every
      # ancestor, so a four-line rc saying `disable=all` at the repository root
      # turns this job green PERMANENTLY — while it still prints "analysing 5
      # file(s):" and lists all five. Measured 2026-08-30, both directions.
      # That needs no attacker: a maintainer adding an rc for editor parity
      # does it. The empty-discovery guard below does not cover it, because
      # discovery is not what was neutered. Inline `# shellcheck disable=`
      # directives are unaffected by --norc — also measured, because the one
      # suppression this repository has is inline and had to survive.
      #
      # NUL-delimited into an array, never a whitespace-split string: a tracked
      # path containing a space would otherwise be analysed as two files that do
      # not exist, and shellcheck would fail for the wrong reason.
      #
      # The version assertion comes FIRST: GITHUB_PATH prepends, so the pinned
      # copy should win over the image's, but "should" is the word this
      # repository does not accept from a gate. If anything resolved the
      # image's analyser instead, this fails by name rather than analysing
      # under a version nobody chose.
      - name: Analyse the first-party shell files
        run: |
          want="${SHELLCHECK_VERSION#v}"
          have="$(shellcheck --version | sed -n 's/^version: //p')"
          [ "$have" = "$want" ] || {
            echo "shellcheck on PATH is '$have' at $(command -v shellcheck), expected the pinned $want" >&2
            exit 1
          }
          echo "analysing with shellcheck $have from $(command -v shellcheck)"
          mapfile -d '' files < <(git ls-files -z -- '*.sh' '*.bash' ':(exclude).specify/')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "the discovery matched no shell file; this job examined NOTHING" >&2
            exit 1
          fi
          printf 'analysing %s file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          shellcheck --norc -f gcc -- "${files[@]}"

      # actionlint (ACTIONLINT_VERSION above), pinned and checksum-verified on
      # the same terms as shellcheck: a tarball that hashes to anything else is
      # never unpacked. Only the binary is extracted.
      - name: Install the pinned actionlint
        run: |
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tarball="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 -o "$tarball" "$url"
          got="$(sha256sum < "$tarball" | cut -d' ' -f1)"
          [ "$got" = "$ACTIONLINT_SHA256" ] || {
            echo "actionlint ${ACTIONLINT_VERSION} tarball hashes to $got, expected $ACTIONLINT_SHA256; refusing to install it" >&2
            exit 1
          }
          echo "actionlint ${ACTIONLINT_VERSION} tarball matches $ACTIONLINT_SHA256"
          dir="$RUNNER_TEMP/actionlint-${ACTIONLINT_VERSION}"
          mkdir -p "$dir"
          tar -xzf "$tarball" -C "$dir" actionlint
          "$dir/actionlint" --version
          echo "$dir" >> "$GITHUB_PATH"

      # WHAT THIS READS: every tracked workflow file, discovered rather than
      # listed, so a workflow added later is linted the day it lands; and an
      # empty discovery is a failure, for the reason given above. actionlint
      # checks the workflow syntax and expressions, and extracts each `run:`
      # block and hands it to shellcheck, which is how the inline shell of this
      # file, the release-tag step included, is finally read by an analyser.
      #
      # WHICH shellcheck: the pinned one, by absolute path, after asserting its
      # version. actionlint silently SKIPS the shell check when it finds no
      # shellcheck, so leaving it to search PATH would let a missing analyser
      # read as a clean workflow.
      #
      # A POSITIVE CONTROL runs first, because a green lint proves nothing
      # until the same command has been seen to go red. A throwaway workflow
      # whose one `run:` line holds an unquoted expansion must FAIL, and fail
      # with SC2086, the shellcheck code; failing for any other reason does not
      # show the shell check is live. Measured locally with 1.7.12 and
      # shellcheck 0.11.0: it fails with exactly that code, and a .shellcheckrc
      # saying disable=all beside the file does not quiet it.
      #
      # What this does NOT prove: actionlint substitutes a placeholder for every
      # `${{ }}` expression before shellcheck sees the script, so shell built by
      # an expression is checked only in that placeholder form.
      - name: Lint the workflows, inline shell included
        run: |
          want="${SHELLCHECK_VERSION#v}"
          sc="$(command -v shellcheck)"
          have="$("$sc" --version | sed -n 's/^version: //p')"
          [ "$have" = "$want" ] || {
            echo "shellcheck on PATH is '$have' at $sc, expected the pinned $want" >&2
            exit 1
          }
          have="$(actionlint --version | sed -n 1p)"
          [ "$have" = "$ACTIONLINT_VERSION" ] || {
            echo "actionlint on PATH is '$have' at $(command -v actionlint), expected the pinned $ACTIONLINT_VERSION" >&2
            exit 1
          }
          echo "linting with actionlint $have and shellcheck $want from $sc"
          canary="$RUNNER_TEMP/canary.yml"
          cat > "$canary" <<'CANARY'
          on: push
          jobs:
            canary:
              runs-on: ubuntu-24.04
              steps:
                - run: echo $UNQUOTED_CANARY
          CANARY
          if actionlint -shellcheck "$sc" -- "$canary" > "$RUNNER_TEMP/canary.out" 2>&1; then
            echo "actionlint passed a run: line with an unquoted expansion; its shell check is not running" >&2
            exit 1
          fi
          grep -q -- 'SC2086' "$RUNNER_TEMP/canary.out" || {
            echo "actionlint failed the control, but not with SC2086; its shell check is not shown live:" >&2
            cat "$RUNNER_TEMP/canary.out" >&2
            exit 1
          }
          echo "control: actionlint reported SC2086 on the planted line"
          mapfile -d '' workflows < <(git ls-files -z -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#workflows[@]}" -eq 0 ]; then
            echo "the discovery matched no workflow file; this step examined NOTHING" >&2
            exit 1
          fi
          printf 'linting %s workflow(s):\n' "${#workflows[@]}"
          printf '  %s\n' "${workflows[@]}"
          actionlint -shellcheck "$sc" -- "${workflows[@]}"
